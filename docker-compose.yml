services:
  biodiversity-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biodiversity-dashboard
    ports:
      - "3050:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
